      #     [[ ! -d $HOME/.ssh ]] && mkdir $HOME/.ssh
      #     echo "$SSH_RSAKEY" >> $HOME/.ssh/id_rsa
      #     chmod 600 $HOME/.ssh/*

      # - name: Split the packages
